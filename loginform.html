<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            background: #111827;
        }

        /* Background video */
        .background-video {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Dark overlay for readability */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* Login container */
        .login-container {
            width: 100%;
            max-width: 400px;
            padding: clamp(24px, 5vw, 40px);
            background: rgba(135, 206, 235, 0.94);
            border-radius: 16px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            color: #222;
            font-size: clamp(28px, 5vw, 35px);
            font-weight: bold;
            text-align: center;
            margin-bottom: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 16px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .input-group input {
            display: block;
            width: 100%;
            min-width: 0;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            background: white;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .submit-btn:hover {
            background: #4f5fd1;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        .error-message {
            display: none;
            color: #b91c1c;
            font-size: 14px;
            margin-top: 14px;
            text-align: center;
        }

        /* Small mobile screens */
        @media (max-width: 360px) {
            body {
                padding: 12px;
            }

            .login-container {
                padding: 22px 18px;
            }

            .subtitle {
                margin-bottom: 22px;
            }
        }

        /* Landscape mobile screens */
        @media (max-height: 500px) and (orientation: landscape) {
            body {
                align-items: flex-start;
                padding-top: 20px;
                padding-bottom: 20px;
            }

            .login-container {
                margin: auto;
            }
        }

        /* Respect reduced motion preferences */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                transition: none !important;
            }
        }
    </style>
</head>

<body>

    <video autoplay muted loop playsinline class="background-video">
        <source src="background.mp4" type="video/mp4">
    </video>

    <div class="login-container">
        <form id="loginForm">
            <p class="subtitle">Sign Up!</p>

            <div class="input-group">
                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">Login</button>

            <p id="errorMessage" class="error-message" role="alert">
                Invalid username or password.
            </p>
        </form>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const errorMessage = document.getElementById("errorMessage");

            if (username === "Colance" && password === "12345") {
                window.location.href = "index.html";
            } else {
                errorMessage.style.display = "block";
            }
        });
    </script>

</body>
</html>
